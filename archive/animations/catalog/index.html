const key='ledge-picks'; let picks=new Set(JSON.parse(localStorage.getItem(key)||'[]'));
function name(f){return f.querySelector('figcaption').firstChild.textContent.trim()}
function paint(){document.querySelectorAll('figure').forEach(f=>f.classList.toggle('on',picks.has(name(f))));document.getElementById('copy').textContent='Copy '+picks.size+' picked'}
document.querySelectorAll('figure').forEach(f=>f.addEventListener('click',()=>{const n=name(f);picks.has(n)?picks.delete(n):picks.add(n);localStorage.setItem(key,JSON.stringify([...picks]));paint()}));
function copySel(){const t=[...picks].join(', ');navigator.clipboard.writeText(t).then(()=>{document.getElementById('hint').textContent='Copied: '+t});}
paint();
</script></body></html>
